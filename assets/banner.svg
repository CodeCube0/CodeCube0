<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <!-- Indigo Blueprint, same tokens as the site hero:
       color-primary-fixed  oklch(0.40 0.11 250) = #054980
       color-accent-fixed   oklch(0.75 0.14 200) = #00c8d1 -->
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <!-- Blueprint grid fades out from the monogram frame, like the hero mask at 72% 50% -->
    <radialGradient id="grid-fade" cx="864" cy="130" r="760" gradientUnits="userSpaceOnUse">
      <stop offset=".45" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="grid-mask">
      <rect width="1200" height="260" fill="url(#grid-fade)"/>
    </mask>
  </defs>

  <rect width="1200" height="260" fill="#054980"/>
  <rect width="1200" height="260" fill="url(#grid)" mask="url(#grid-mask)"/>

  <text x="80" y="128" fill="#fff" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="700" letter-spacing="-1.7">Fabio Fiorucci</text>
  <text x="82" y="172" fill="#00c8d1" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="500" letter-spacing="1">Software Engineer • Frontend Specialist</text>

  <!-- Monogram panel with technical-drawing corner brackets (hero__frame-outer) -->
  <g transform="translate(804 70)">
    <rect width="120" height="120" rx="10" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".25"/>
    <text x="60" y="76" fill="#fff" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700" letter-spacing="-1">FF</text>
    <path d="M-14 8V-14H8 M112 -14H134V8 M134 112V134H112 M8 134H-14V112" fill="none" stroke="#00c8d1" stroke-opacity=".7" stroke-width="2"/>
  </g>
</svg>
